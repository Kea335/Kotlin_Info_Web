# ============================================================
#  KotlinAZ — Docker Compose
#
#  Layihə kök qovluğundan işə sal:
#    docker compose -f deploy/docker-compose.yml up -d
#
#  Dayandırmaq:
#    docker compose -f deploy/docker-compose.yml down
#
#  Sayt: http://localhost:8080
# ============================================================

services:
  kotlinaz:
    build:
      context: ..                    # layihə kök qovluğu
      dockerfile: deploy/Dockerfile
    image: kotlinaz:1.0.0
    container_name: kotlinaz
    restart: unless-stopped
    ports:
      - "8080:80"                    # xarici port : daxili port
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
