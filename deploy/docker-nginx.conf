# Docker imici daxilində işlədilən Nginx konfiqurasiyası
# (Dockerfile bunu /etc/nginx/conf.d/ qovluğuna kopyalayır)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js)$ {
        # expires ozu Cache-Control ve Expires basliqlarini yaradir —
        # elave add_header yazsaq baslig tekrarlanir.
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
