# ============================================================
#  KotlinAZ — Nginx konfiqurasiyası
#  /etc/nginx/sites-available/kotlinaz
#
#  Aktivləşdirmək:
#    sudo ln -s /etc/nginx/sites-available/kotlinaz /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ Öz domenini yaz (yoxdursa: server_name _;)
    server_name saytin-adi.az www.saytin-adi.az;

    # ↓↓↓ Faylları kopyaladığın qovluq
    root /var/www/kotlinaz;
    index index.html;

    # Azərbaycan hərflərinin düzgün göstərilməsi üçün VACİBDİR
    charset utf-8;
    charset_types text/css application/javascript text/plain application/json;

    # Sayt tək səhifədir və naviqasiya hash (#bolme) üzərindədir,
    # ona görə mürəkkəb rewrite qaydaları lazım deyil.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Keşləmə ----------
    # index.html keşlənmir ki, yeniləmələr dərhal görünsün
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS fayllarında ?v=... parametri olduğu üçün uzun müddət keşlənə bilər
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 180d;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # ---------- Sıxılma ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        image/svg+xml;

    # Brotli varsa (nginx-module-brotli quraşdırılıbsa) bunu da aç:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript image/svg+xml;

    # ---------- Təhlükəsizlik başlıqları ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gizli faylların (məsələn .git) verilməsinin qarşısını alır
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/kotlinaz-access.log;
    error_log  /var/log/nginx/kotlinaz-error.log;
}

# ============================================================
#  HTTPS üçün:
#    sudo certbot --nginx -d saytin-adi.az -d www.saytin-adi.az
#  Certbot yuxarıdakı bloku avtomatik olaraq 443 portuna uyğunlaşdırır
#  və 80 → 443 yönləndirməsini əlavə edir.
# ============================================================
